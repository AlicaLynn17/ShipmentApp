<ion-header>
  <ion-toolbar>
    <ion-title>Shipment Details</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="shipmentDetails">
    <h2>Shipment ID: {{ shipmentDetails.id }}</h2>
    <p>Status: {{ shipmentDetails.status }}</p>
    <p>Location: {{ shipmentDetails.latitude }}, {{ shipmentDetails.longitude }}</p>
  </div>
  <div *ngIf="!shipmentDetails">
    <p>No shipment details found.</p>
  </div>
</ion-content>
